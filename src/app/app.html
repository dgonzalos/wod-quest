<main class="page">
  <div class="theme-switcher">
    <button
      [attr.aria-pressed]="theme.preference() === 'light'"
      (click)="theme.setPreference('light')"
      class="button"
      type="button"
    >
      Claro
    </button>
    <button
      [attr.aria-pressed]="theme.preference() === 'dark'"
      (click)="theme.setPreference('dark')"
      class="button"
      type="button"
    >
      Oscuro
    </button>
  </div>

  <h1>{{ title() }}</h1>

  <section class="character">
    <h2>{{ character.name }}</h2>
    <dl>
      <dt>Facción</dt>
      <dd>{{ factionLabels[character.faction] }}</dd>
      <dt>XP</dt>
      <dd>{{ xp }}</dd>
      <dt>Nivel</dt>
      <dd>{{ level }}</dd>
    </dl>
  </section>

  <ul class="quest-list" role="list">
    @for (quest of quests; track quest.id) {
      <li>
        <app-quest-card [quest]="quest" />
      </li>
    }
  </ul>
</main>

<router-outlet />
